name: Deploy Published Firmware to GitHub Pages

on:
  workflow_call:
    inputs:
      source_commit:
        description: "Exact source commit successfully published"
        required: true
        type: string
      version:
        description: "Exact public release to advertise"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build from Successfully Published Source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact published source
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
      - name: Require exact public release and complete package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TheOnlyHyland/True-Family-Voice-Firmware"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          sh ./scripts/verify-version "$VERSION"
          release=$(gh release view "$VERSION" --json isDraft,tagName)
          test "$(jq -r '.isDraft' <<< "$release")" = "false"
          test "$(jq -r '.tagName' <<< "$release")" = "$VERSION"
          mkdir release-package
          for file in \
            true-family-voice-esp32s3.factory.bin \
            true-family-voice-esp32s3.ota.bin \
            true-family-voice-esp32s3.elf \
            SHA256SUMS \
            manifest.json; do
            gh release download "$VERSION" --dir release-package --pattern "$file"
          done
          python3 ./scripts/verify-release-package.py "$VERSION" release-package
      - name: Stage checksum-locked local installer dependency
        run: ./scripts/vendor-installer static/vendor/esp-web-tools
      - name: List only public releases with complete immutable assets
        shell: python
        env:
          CURRENT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import datetime
          import html
          import json
          import os
          import re
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          current_version = os.environ["CURRENT_VERSION"]
          run_id = os.environ["GITHUB_RUN_ID"]
          timestamp = datetime.datetime.now(datetime.UTC).isoformat()
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"
          api_url = f"https://api.github.com/repos/{repo}/releases?per_page=100"
          request = urllib.request.Request(
              api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": repo,
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.load(response)

          version_pattern = re.compile(
              r"^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
              r"(?:-(?:alpha|beta|rc)(?:\.(?:0|[1-9]\d*))?)?$"
          )
          expected_assets = {
              "true-family-voice-esp32s3.factory.bin",
              "true-family-voice-esp32s3.ota.bin",
              "true-family-voice-esp32s3.elf",
              "SHA256SUMS",
              "manifest.json",
          }
          release_options = ""
          advertised_versions = set()
          for release in releases:
              release_version = release["tag_name"]
              asset_names = {asset["name"] for asset in release["assets"]}
              if release["draft"] or asset_names != expected_assets:
                  continue
              if version_pattern.fullmatch(release_version) is None:
                  continue
              release_name = release["name"] or release_version
              description = " (pre-release)" if release["prerelease"] else ""
              release_options += (
                  f'<option value="{html.escape(release_version, quote=True)}">'
                  f"{html.escape(release_name)}{description}</option>\n"
              )
              advertised_versions.add(release_version)
          if current_version not in advertised_versions:
              raise SystemExit("successfully published version is not safely advertisable")

          html_path = "static/index.html"
          with open(html_path, encoding="utf-8") as source:
              html_content = source.read()
          html_content = re.sub(
              r'(<select id="releases">).*?(</select>)',
              lambda match: f"{match.group(1)}{release_options}{match.group(2)}",
              html_content,
              flags=re.DOTALL,
          )
          metadata = (
              f"<!-- created: {html.escape(timestamp, quote=True)} -->\n"
              f"<!-- CI/CD run: {html.escape(run_url, quote=True)} -->\n"
              "<!-- triggered by: successful protected publication -->\n"
              f"<!-- version: {html.escape(current_version, quote=True)} -->\n"
          )
          with open(html_path, "w", encoding="utf-8") as destination:
              destination.write(metadata + html_content)
      - name: Upload Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: static
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs:
      - build
    steps:
      - name: Set up Pages
        # actions/configure-pages v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
