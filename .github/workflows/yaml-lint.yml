name: YAML lint

on:
  push:
    branches:
      - main
    paths:
      - "**.yaml"
      - "**.yml"
      - .yamllint
      - external-inputs.lock
      - requirements-yamllint.in
      - requirements-yamllint.txt
      - scripts/run-actionlint
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint strict
    runs-on: ubuntu-24.04
    steps:
      - name: Check out configuration
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up pinned Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-yamllint.txt
      - name: Install locked yamllint dependency closure
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r requirements-yamllint.txt
      - name: Run strict yamllint
        run: python -m yamllint --strict .
      - name: Run checksum-locked actionlint
        run: sh ./scripts/run-actionlint
