<html>
  <head>
    <title>True Family Voice Realtime</title>
    <meta
      name="description"
      content="Install True Family Voice Realtime firmware."
    />
    <style>
      /* Basic styling for the details element */
      details {
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 10px;
        width: 300px;
        background-color: #f9f9f9;
        margin: 10px;
        font-family: Arial, sans-serif;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease-in-out;
      }

      /* Styling for the summary element */
      summary {
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        outline: none;
      }

      /* Hover effect for summary */
      summary:hover {
        color: #007bff;
      }

      /* Open details transition */
      details[open] {
        border-color: #007bff;
        background-color: #eef6ff;
      }

      details[open] summary {
        margin-bottom: 12px;
      }

      .link {
        margin-top: 8px;
      }
    </style>
  </head>

  <body>
    <div>
      <h1>Install True Family Voice Realtime</h1>
      <p>
        Connect your Home Assistant Voice to your computer and click on connect
        below.
      </p>
      <esp-web-install-button
        manifest="https://firmware.esphome.io/True-Family-Voice-Firmware/home-assistant-voice/manifest.json"
      >
      </esp-web-install-button>
    </div>
    <br />
    <details>
      <summary>Install Specific Version</summary>
      Select a Release: <select id="releases"></select><br />
      <div class="link"><a id="version-link" hidden></a></div>
    </details>
    <script type="module" src="./installer.mjs"></script>
    <script
      type="module"
      src="./vendor/esp-web-tools/install-button.js"
    ></script>
  </body>
</html>
