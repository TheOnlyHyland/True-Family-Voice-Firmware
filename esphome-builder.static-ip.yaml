# ============================================================================
# Per-device stub for the OpenAI Realtime Voice PE firmware -- FIXED IP variant.
#
# Same as esphome-builder.dhcp.yaml, but pinned to a static IP. Copy THIS into your
# ESPHome dashboard ONCE (adopt the device, then edit its YAML). It pulls the
# full firmware from this repo at immutable `0.19.0` refs.
# Those refs do not auto-discover later releases.
#
#   1. Set `name` / `friendly_name` for your device.
#   2. Put these keys in your ESPHome secrets.yaml (Builder -> Secrets):
#        wifi_ssid, wifi_password, api_encryption_key, ota_password,
#        static_ip, gateway, subnet, dns1, dns2
#   3. Install once. For an approved update, advance both refs below to the exact
#      newer tag and compile, or deliberately re-adopt that release's pinned stub.
#
# (For DHCP instead of a fixed IP, use esphome-builder.dhcp.yaml.)
# ============================================================================
substitutions:
  # Keep the device name stable.
  name: my-voice-pe
  friendly_name: Home Assistant Voice
  # Secrets -> substitutions (a remote package can't use !secret directly):
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  static_ip: !secret static_ip
  gateway: !secret gateway
  subnet: !secret subnet
  dns1: !secret dns1
  dns2: !secret dns2

# These `0.19.0` refs are immutable input and do not discover later releases.
# Change both together only after approving a newer exact release tag.
packages:
  realtime:
    url: https://github.com/TheOnlyHyland/True-Family-Voice-Firmware
    ref: "0.19.0"
    files:
      - home-assistant-voice.realtime.yaml
      - home-assistant-voice.adopted.yaml
    refresh: 0s
  # Merge a manual_ip block into the firmware's wifi: config for a fixed IP:
  static_ip:
    wifi:
      manual_ip:
        static_ip: ${static_ip}
        gateway: ${gateway}
        subnet: ${subnet}
        dns1: ${dns1}
        dns2: ${dns2}

dashboard_import:
  package_import_url: github://TheOnlyHyland/True-Family-Voice-Firmware/esphome-builder.static-ip.yaml@0.19.0
  import_full_config: false
