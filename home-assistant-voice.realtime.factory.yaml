# Generic, publishable True Family Voice Realtime image.
# Per-device Wi-Fi, encrypted API, and OTA credentials are added on adoption.
substitutions:
  name: true-family-voice
  friendly_name: "True Family Voice Realtime"
  firmware_version: "0.19.0"
  wifi_ssid: "factory-provisioning"
  wifi_password: ""
  va_url: "ws://homeassistant.local:8080/"
  va_client_source: esphome/components

packages:
  realtime: !include home-assistant-voice.realtime.yaml

esphome:
  name_add_mac_suffix: true

http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    name: "True Family Voice Realtime Firmware"
    source: https://firmware.esphome.io/True-Family-Voice-Firmware/home-assistant-voice/manifest.json
