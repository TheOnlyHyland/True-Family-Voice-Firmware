# ============================================================================
# Per-device stub for the OpenAI Realtime Voice PE firmware.
#
# Copy THIS into your ESPHome dashboard ONCE (add/adopt the device, then edit its
# YAML). It pulls the full firmware from this repo at immutable `0.19.0` refs.
# Those refs do not auto-discover later releases.
#
#   1. Set `name` / `friendly_name` for your device.
#   2. Put the keys below in your ESPHome secrets.yaml (Builder -> Secrets):
#        wifi_ssid, wifi_password, api_encryption_key, ota_password
#   3. Install once. For an approved update, advance both refs below to the exact
#      newer tag and compile, or deliberately re-adopt that release's pinned stub.
# ============================================================================
substitutions:
  # Keep the device name stable.
  name: my-voice-pe
  friendly_name: Home Assistant Voice
  # Secrets -> substitutions (a remote package can't use !secret directly):
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password

# These `0.19.0` refs are immutable input and do not discover later releases.
# Change both together only after approving a newer exact release tag.
packages:
  realtime:
    url: https://github.com/TheOnlyHyland/True-Family-Voice-Firmware
    ref: "0.19.0"
    files:
      - home-assistant-voice.realtime.yaml
      - home-assistant-voice.adopted.yaml
    refresh: 0s

dashboard_import:
  package_import_url: github://TheOnlyHyland/True-Family-Voice-Firmware/esphome-builder.dhcp.yaml@0.19.0
  import_full_config: false

# --- Fixed (static) IP? -----------------------------------------------------
# This file uses DHCP. For a fixed IP, use esphome-builder.static-ip.yaml instead
# -- a ready-to-paste version with the manual_ip block already wired up.
# ============================================================================
